<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cove — trusted contacts ring through, DTMF call screening, and a clear voicemail log. Not coveai.dev." />
    <meta name="theme-color" content="#487878" />
    <title>Cove</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Theme bootstrap before paint (localStorage override, else prefers-color-scheme)
      (function () {
        try {
          var k = 'cove-theme';
          var t = localStorage.getItem(k);
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script>
      // GitHub Pages SPA: restore path encoded by 404.html (?p=/auth)
      (function () {
        var l = window.location;
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var params = l.search.slice(1).split('&');
          var path = '';
          var query = '';
          for (var i = 0; i < params.length; i++) {
            var kv = params[i].split('=');
            if (kv[0] === 'p') path = decodeURIComponent(kv[1] || '').replace(/~and~/g, '&');
            if (kv[0] === 'q') query = decodeURIComponent(kv[1] || '').replace(/~and~/g, '&');
          }
          if (path) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + path + (query ? '?' + query : '') + l.hash
            );
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
